name: snapshot-cron

# Every 5 minutes, 13:00–21:59 UTC, weekdays — a superset of SPX RTH
# (09:30–16:00 ET) across both DST regimes. The job itself does the
# precise ET/weekend check so DST is handled without touching the cron.
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: RTH guard (ET, DST-aware)
        id: guard
        shell: bash
        run: |
          dow=$(TZ=America/New_York date +%u)
          hhmm=$(TZ=America/New_York date +%H%M)
          if (( dow > 5 || 10#$hhmm < 930 || 10#$hhmm >= 1600 )); then
            echo "Outside RTH (ET day=$dow time=$hhmm) — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: POST /jobs/snapshot
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          # --retry-all-errors retries 5xx and connect failures (Fly cold
          # start can take ~30s); a final failure fails the workflow loudly.
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 180 \
            -X POST "https://vegalab-api.fly.dev/jobs/snapshot" \
            -H "X-Job-Secret: ${JOB_SECRET}"
        env:
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
