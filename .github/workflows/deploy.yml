name: deploy-backend

on:
  push:
    branches: [main]
    paths:
      - "vegalab/backend/**"
      - "vegalab/pyproject.toml"
      - "vegalab/Dockerfile"
      - "vegalab/fly.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    defaults:
      run:
        working-directory: vegalab
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check required secrets
        run: |
          missing=0
          [ -n "$FLY_API_TOKEN" ] || { echo "::error::GitHub secret FLY_API_TOKEN is not set"; missing=1; }
          [ -n "$DATABASE_URL" ]  || { echo "::error::GitHub secret DATABASE_URL is not set"; missing=1; }
          [ -n "$JOB_SECRET" ]    || { echo "::error::GitHub secret JOB_SECRET is not set"; missing=1; }
          exit $missing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}

      # App creation fails if it already exists, which is exactly the
      # signal we use to bootstrap backend secrets on the first run only.
      - name: Create app + set secrets (first run only)
        run: |
          if flyctl apps create vegalab-api; then
            echo "App created — staging backend secrets"
            flyctl secrets set --app vegalab-api --stage \
              DATABASE_URL="$DATABASE_URL" \
              JOB_SECRET="$JOB_SECRET" \
              CORS_ORIGINS="$CORS_ORIGINS" \
              DATA_PROVIDER=cboe
          else
            echo "App already exists — skipping secret bootstrap"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}

      - name: Deploy
        run: flyctl deploy --remote-only
